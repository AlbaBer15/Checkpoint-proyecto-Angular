<h2 class="titulo-misiones">Registro de misiones</h2>

<div class="container">
  <!-- Renderizado dinámico con ngFor -->
  <app-mission-card
    *ngFor="let m of misiones"
    [titulo]="m.titulo"
    [descripcion]="m.descripcion"
    [xp]="m.xp"
    [estado]="m.estado"
    [favorito]="m.favorito ?? false"
    (completar)="completarMision(m.titulo)"
    (eliminar)="eliminarMision(m.titulo)"
    (marcarFavorito)="marcarFavorito(m)"
  >
    <!-- Eventos enviados desde MissionCard -->
  </app-mission-card>
</div>
