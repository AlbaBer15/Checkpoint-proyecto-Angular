<!-- Tarjeta individual de misión -->
<div class="tarjeta" [class.completada]="mision.estado === 'completada'">

  <!-- FILA SUPERIOR: Corazón + Título + XP -->
  <div class="fila-superior">

    <!-- Bloque izquierdo: favorito + título -->
    <div class="lado-izquierdo">
      <!-- Botón favorito -->
      <button class="btn-favorito"
              [ngClass]="{ activo: (mision.favorito ?? false) }"
              (click)="toggleFavorito()">
        ❤️
      </button>

      <h3 class="titulo-mision">{{ mision.titulo }}</h3>
    </div>

    <!-- XP en la esquina derecha -->
    <span class="xp-badge">⚡ {{ mision.xp }} XP</span>
  </div>

  <!-- Descripción -->
  <p class="descripcion">{{ mision.descripcion }}</p>

  <!-- Acciones -->
  <div class="acciones">

    <button class="btn-completar-gamer"
            *ngIf="mision.estado === 'pendiente'"
            (click)="marcarComoCompletada()">
      🎯 Completar misión
    </button>

    <button class="btn-eliminar-gamer"
            (click)="eliminarMision()">
      🗑️ Eliminar
    </button>

  </div>

  <p *ngIf="mision.estado === 'completada'" class="tag-completada">
    🏆 Misión completada
  </p>

</div>
<!-- Fin de la tarjeta de misión -->
