<div class="tarjeta" [class.completada]="mision.estado === 'completada'" [class.animado]="animado">
  <div *ngIf="editando" class="form-edicion">
    <div class="campo-edit">
      <label>Título</label>
      <input type="text" [(ngModel)]="tituloEdit" maxlength="120" />
    </div>

    <div class="campo-edit">
      <label>Descripción</label>
      <textarea rows="2" [(ngModel)]="descripcionEdit" maxlength="500"></textarea>
    </div>

    <div class="campo-edit campo-xp">
      <label>XP</label>
      <input type="number" [(ngModel)]="xpEdit" min="1" max="999" />
    </div>

    <div class="campo-edit">
      <label>Categoría</label>
      <select [(ngModel)]="categoriaEdit">
        <option [ngValue]="undefined">Sin categoría</option>
        <option *ngFor="let cat of categorias" [ngValue]="cat.id">
          {{ cat.icono }} {{ cat.nombre }}
        </option>
      </select>
    </div>

    <p *ngIf="errorEdicion" class="error-edicion">{{ errorEdicion }}</p>
    <div class="acciones-edit">
      <button class="btn-guardar-edit" (click)="guardarEdicion()">💾 Guardar</button>
      <button class="btn-cancelar-edit" (click)="cancelarEdicion()">✖ Cancelar</button>
    </div>
  </div>

  <div *ngIf="!editando">
    <div class="fila-superior">
      <div class="lado-izquierdo">
        <button
          class="btn-favorito"
          [ngClass]="{ activo: mision.favorito ?? false }"
          (click)="toggleFavorito()"
        >
          ❤️
        </button>
        <h3 class="titulo-mision">{{ mision.titulo }}</h3>
      </div>
      <span class="xp-badge">⚡ {{ mision.xp }} XP</span>
    </div>

    <p class="descripcion">{{ mision.descripcion }}</p>
    <span *ngIf="mision.category" class="badge-categoria">
      {{ mision.category.icono }} {{ mision.category.nombre }}
    </span>

    <div class="acciones">
      <button
        class="btn-completar-gamer"
        *ngIf="mision.estado === 'pendiente'"
        (click)="marcarComoCompletada()"
      >
        🎯 Completar misión
      </button>

      <button
        class="btn-revertir-gamer"
        *ngIf="mision.estado === 'completada'"
        (click)="revertirMision()"
      >
        🔄 Revertir
      </button>

      <button class="btn-editar-gamer" (click)="activarEdicion()">✏️ Editar</button>

      <button class="btn-eliminar-gamer" (click)="eliminarMision()">🗑️ Eliminar</button>
    </div>

    <p *ngIf="mision.estado === 'completada'" class="tag-completada">🏆 Misión completada</p>
  </div>
</div>
